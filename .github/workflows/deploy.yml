name: Production Build & Deploy Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify-and-deploy:
    name: Verify Build & Update Deployments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build

      - name: Sync GitHub Production Deployment Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'Production',
                description: 'VARSHANET 2.0 Production Deployment (Render)',
                auto_merge: false,
                required_contexts: []
              });

              if (deployment.data && deployment.data.id) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.data.id,
                  state: 'success',
                  environment: 'Production',
                  description: 'Operational on Render',
                  auto_inactive: true
                });
                console.log('Successfully recorded verified Production deployment!');
              }
            } catch (err) {
              console.log('Deployment status note:', err.message);
            }
