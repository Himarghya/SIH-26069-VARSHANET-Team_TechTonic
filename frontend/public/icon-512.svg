<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#083344" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cloudGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="boltGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#0e7490" stroke-width="8" />

  <!-- Radar / Wave rings in background -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#0891b2" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.2" />

  <!-- Cloud Shape -->
  <g filter="url(#glow512)">
    <path d="M170 320 h172 a64 64 0 0 0 0-128 a85 85 0 0 0-160-32 a70 70 0 0 0-54 75 a48 48 0 0 0 42 85 z"
          fill="url(#cloudGrad512)" />
  </g>

  <!-- Lightning Bolt -->
  <polygon points="262,272 218,336 256,336 240,394 304,314 268,314" fill="url(#boltGrad512)" />

  <!-- Rain Drops -->
  <line x1="180" y1="346" x2="164" y2="384" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="336" y1="346" x2="320" y2="384" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

  <!-- VARSHANET 2.0 Badge -->
  <rect x="76" y="405" width="360" height="64" rx="32" fill="#0f172a" stroke="#06b6d4" stroke-width="4" />
  <text x="256" y="448" fill="#e0f2fe" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="4">VARSHANET 2.0</text>
</svg>
