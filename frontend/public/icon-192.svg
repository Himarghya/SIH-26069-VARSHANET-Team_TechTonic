<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#083344" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background rounded square -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#0e7490" stroke-width="3" />

  <!-- Radar / Wave rings in background -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <circle cx="96" cy="96" r="80" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Cloud Shape -->
  <g filter="url(#glow)">
    <path d="M64 120 h64 a24 24 0 0 0 0-48 a32 32 0 0 0-60-12 a26 26 0 0 0-20 28 a18 18 0 0 0 16 32 z"
          fill="url(#cloudGrad)" />
  </g>

  <!-- Lightning Bolt -->
  <polygon points="98,102 82,126 96,126 90,148 114,118 100,118" fill="url(#boltGrad)" />

  <!-- Rain Drops -->
  <line x1="68" y1="130" x2="62" y2="144" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="126" y1="130" x2="120" y2="144" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- VARSHANET 2.0 Badge -->
  <rect x="28" y="152" width="136" height="24" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="96" y="168" fill="#e0f2fe" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.5">VARSHANET 2.0</text>
</svg>
