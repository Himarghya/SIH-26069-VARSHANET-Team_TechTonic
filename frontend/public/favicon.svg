<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192e" />
      <stop offset="50%" stop-color="#0c325c" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Radar Wave Arcs (Doppler / Satellite network) -->
  <path d="M 38 13 A 20 20 0 0 1 51 26" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 42 8 A 26 26 0 0 1 58 24" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" opacity="0.65" />
  <path d="M 46 3 A 32 32 0 0 1 63 20" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.4" />

  <!-- Cloud Body -->
  <g filter="url(#glow)">
    <path d="M 23 37 L 43 37 A 7 7 0 0 0 43 23 A 9.5 9.5 0 0 0 25.5 21.5 A 7 7 0 0 0 23 37 Z" fill="url(#cloudGrad)" />
  </g>

  <!-- Digital Weather Radar Spark / Node in Cloud -->
  <circle cx="32" cy="27" r="2.5" fill="#0284c7" />
  <circle cx="32" cy="27" r="1.2" fill="#ffffff" />

  <!-- Rainfall Droplets / Stream Lines -->
  <g stroke="url(#rainGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="22" y1="41" x2="19" y2="48" />
    <line x1="29" y1="41" x2="26" y2="50" />
    <line x1="36" y1="41" x2="33" y2="48" />
    <line x1="43" y1="41" x2="40" y2="47" />
  </g>

  <!-- Pulse Dot Indicator -->
  <circle cx="16" cy="18" r="2" fill="#38bdf8" />
</svg>